<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Unificada dos Movimentos Sociais</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FullCalendar -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <style>
        .fc-event {
            background-color: #b91c1c !important;
            border: none !important;
            color: white !important;
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 2px;
        }
        .fc-event-title {
            white-space: normal !important;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            font-weight: 500;
        }
        @media (max-width: 640px) {
            .fc-header-toolbar {
                flex-direction: column;
                gap: 10px;
            }
            .fc-toolbar-chunk {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 4px;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

    <!-- Header otimizado para mobile -->
    <header class="bg-red-700 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="text-center sm:text-left">
                <h1 class="text-xl sm:text-2xl font-bold flex items-center justify-center sm:justify-start gap-2">
                    <span>✊</span> Agenda dos Movimentos
                </h1>
                <p class="text-xs text-red-100">Evite conflitos de datas e fortaleça os atos</p>
            </div>
            <!-- Botão com chamada explícita para a função global -->
            <button type="button" id="openCreateModalBtn" class="w-full sm:w-auto bg-white text-red-700 font-bold px-5 py-2.5 rounded-xl shadow hover:bg-red-50 transition active:scale-95">
                + Cadastrar Novo Ato
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-2 sm:px-4 py-4 sm:py-8">
        <!-- Caixa do Calendário -->
        <div id="calendar" class="bg-white p-3 sm:p-6 rounded-2xl shadow-sm border border-slate-200"></div>
    </main>

    <!-- Modal de Cadastro / Edição -->
    <div id="eventModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-3 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl max-h-[92vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modalTitle" class="text-lg sm:text-xl font-bold text-slate-900">Cadastrar Novo Ato ou Evento</h2>
                <button type="button" id="closeCreateModalBtn" class="text-slate-400 hover:text-slate-600 text-2xl font-bold px-2">×</button>
            </div>
            <form id="eventForm" class="space-y-4">
                <input type="hidden" id="eventId">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nome do Ato / Evento *</label>
                    <input type="text" id="title" required placeholder="Ex: Ato em Defesa da Educação" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 outline-none text-base">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Movimento / Coletivo Organizador *</label>
                    <input type="text" id="coletivo" required placeholder="Ex: Frente de Luta de Rua" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 outline-none text-base">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Data *</label>
                    <input type="date" id="date" required class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 outline-none text-base">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs sm:text-sm font-semibold text-slate-700 mb-1">Início</label>
                        <input type="time" id="time" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 outline-none text-base">
                    </div>
                    <div>
                        <label class="block text-xs sm:text-sm font-semibold text-slate-700 mb-1">Término (Opcional)</label>
                        <input type="time" id="endTime" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 outline-none text-base">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Local (Praça, Endereço, etc.)</label>
                    <input type="text" id="location" placeholder="Ex: Praça da Matriz" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 outline-none text-base">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Descrição curta</label>
                    <textarea id="description" rows="2" placeholder="Detalhes importantes sobre a mobilização..." class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 outline-none text-base"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Link de Divulgação (Opcional)</label>
                    <input type="url" id="link" placeholder="https://instagram.com/p/..." class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 outline-none text-base">
                </div>
                <div class="flex flex-col sm:flex-row justify-end gap-2 pt-2">
                    <button type="button" id="cancelCreateModalBtn" class="w-full sm:w-auto px-5 py-3 border border-slate-300 rounded-xl text-slate-600 font-semibold hover:bg-slate-50">Cancelar</button>
                    <button type="submit" class="w-full sm:w-auto px-6 py-3 bg-red-700 text-white font-bold rounded-xl hover:bg-red-800 shadow-md">Salvar Evento</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Detalhes do Evento -->
    <div id="detailsModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-3 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-2xl relative">
            <button type="button" id="closeDetailsXBtn" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-2xl font-bold px-2">×</button>
            <div id="detailsContent" class="space-y-3 mt-1">
                <!-- Conteúdo injetado via JS -->
            </div>
            <div class="mt-6 flex flex-col sm:flex-row justify-between items-center gap-2 pt-2 border-t border-slate-100">
                <div class="flex gap-2 w-full sm:w-auto">
                    <button type="button" id="editBtn" class="flex-1 sm:flex-none px-4 py-2 bg-amber-600 text-white text-sm font-bold rounded-xl hover:bg-amber-700">Editar</button>
                    <button type="button" id="deleteBtn" class="flex-1 sm:flex-none px-4 py-2 bg-slate-700 text-white text-sm font-bold rounded-xl hover:bg-slate-800">Excluir</button>
                </div>
                <button type="button" id="closeDetailsBtn" class="w-full sm:w-auto px-4 py-2 bg-slate-200 text-slate-700 text-sm font-bold rounded-xl hover:bg-slate-300">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        let calendar;
        let currentEventData = null;

        // Funções globais de controle de modais
        function openModal() {
            const titleEl = document.getElementById('modalTitle');
            const formEl = document.getElementById('eventForm');
            const idEl = document.getElementById('eventId');
            const modalEl = document.getElementById('eventModal');

            if (titleEl) titleEl.textContent = 'Cadastrar Novo Ato ou Evento';
            if (formEl) formEl.reset();
            if (idEl) idEl.value = '';
            if (modalEl) modalEl.classList.remove('hidden');
        }

        function openModalForEdit(data) {
            const titleEl = document.getElementById('modalTitle');
            const idEl = document.getElementById('eventId');
            const titleInput = document.getElementById('title');
            const coletivoInput = document.getElementById('coletivo');
            const dateInput = document.getElementById('date');
            const timeInput = document.getElementById('time');
            const endTimeInput = document.getElementById('endTime');
            const locationInput = document.getElementById('location');
            const descriptionInput = document.getElementById('description');
            const linkInput = document.getElementById('link');
            const modalEl = document.getElementById('eventModal');

            if (titleEl) titleEl.textContent = 'Editar Ato ou Evento';
            if (idEl) idEl.value = data.id || '';
            if (titleInput) titleInput.value = data.title || '';
            if (coletivoInput) coletivoInput.value = data.coletivo || '';
            if (dateInput) dateInput.value = data.date || '';
            if (timeInput) timeInput.value = data.time || '';
            if (endTimeInput) endTimeInput.value = data.endTime || '';
            if (locationInput) locationInput.value = data.location || '';
            if (descriptionInput) descriptionInput.value = data.description || '';
            if (linkInput) linkInput.value = data.link || '';
            if (modalEl) modalEl.classList.remove('hidden');
        }

        function closeModal() {
            const modalEl = document.getElementById('eventModal');
            const formEl = document.getElementById('eventForm');
            const idEl = document.getElementById('eventId');

            if (modalEl) modalEl.classList.add('hidden');
            if (formEl) formEl.reset();
            if (idEl) idEl.value = '';
        }

        function closeDetailsModal() {
            const detailsModalEl = document.getElementById('detailsModal');
            if (detailsModalEl) detailsModalEl.classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Vinculando eventos de clique via JavaScript de forma segura
            const openCreateBtn = document.getElementById('openCreateModalBtn');
            if (openCreateBtn) openCreateBtn.onclick = openModal;

            const closeCreateBtn = document.getElementById('closeCreateModalBtn');
            if (closeCreateBtn) closeCreateBtn.onclick = closeModal;

            const cancelCreateBtn = document.getElementById('cancelCreateModalBtn');
            if (cancelCreateBtn) cancelCreateBtn.onclick = closeModal;

            const closeDetailsXBtn = document.getElementById('closeDetailsXBtn');
            if (closeDetailsXBtn) closeDetailsXBtn.onclick = closeDetailsModal;

            const closeDetailsBtn = document.getElementById('closeDetailsBtn');
            if (closeDetailsBtn) closeDetailsBtn.onclick = closeDetailsModal;

            var calendarEl = document.getElementById('calendar');
            
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'listWeek',
                locale: 'pt-br',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,listWeek'
                },
                buttonText: {
                    today: 'Hoje',
                    month: 'Mês',
                    week: 'Semana',
                    list: 'Lista'
                },
                events: '/api/events',
                eventTimeFormat: {
                    hour: '2-digit',
                    minute: '2-digit',
                    meridiem: false
                },
                eventClick: function(info) {
                    const props = info.event.extendedProps;
                    currentEventData = {
                        id: info.event.id,
                        title: props.title,
                        coletivo: props.coletivo,
                        date: info.event.start ? info.event.start.toISOString().split('T')[0] : '',
                        time: props.time,
                        endTime: props.endTime,
                        location: props.location,
                        description: props.description,
                        link: props.link
                    };
                    
                    let horarioTexto = '';
                    if (props.time && props.time.trim() !== '') {
                        horarioTexto = props.time;
                        if (props.endTime && props.endTime.trim() !== '') {
                            horarioTexto += ` às ${props.endTime}`;
                        }
                    } else if (props.endTime && props.endTime.trim() !== '') {
                        horarioTexto = `Até às ${props.endTime}`;
                    }

                    let html = `
                        <div>
                            <span class="inline-block bg-red-100 text-red-800 text-xs font-bold px-2.5 py-1 rounded-full mb-2">✊ ${props.coletivo || ''}</span>
                            <h3 class="text-lg sm:text-xl font-bold text-slate-900 leading-snug">${props.title}</h3>
                        </div>
                        <hr class="border-slate-100 my-2">
                        <div class="text-sm space-y-1.5 text-slate-700">
                            <p><strong>📅 Data:</strong> ${info.event.start ? info.event.start.toLocaleDateString('pt-BR') : ''}</p>
                            ${horarioTexto ? `<p><strong>⏰ Horário:</strong> ${horarioTexto}</p>` : ''}
                            ${props.location && props.location.trim() !== '' ? `<p><strong>📍 Local:</strong> ${props.location}</p>` : ''}
                        </div>
                        ${props.description && props.description.trim() !== '' ? `<div class="text-sm text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-200 mt-2"><strong>Sobre o ato:</strong><br>${props.description}</div>` : ''}
                        ${props.link && props.link.trim() !== '' ? `<div class="pt-3"><a href="${props.link}" target="_blank" class="block text-sm text-center bg-red-600 text-white font-bold py-3 rounded-xl hover:bg-red-700 transition shadow">🔗 Acessar Link de Divulgação</a></div>` : ''}
                    `;
                    
                    const detailsContentEl = document.getElementById('detailsContent');
                    const detailsModalEl = document.getElementById('detailsModal');
                    if (detailsContentEl) detailsContentEl.innerHTML = html;
                    if (detailsModalEl) detailsModalEl.classList.remove('hidden');
                }
            });
            calendar.render();

            const editBtn = document.getElementById('editBtn');
            if (editBtn) {
                editBtn.onclick = function() {
                    closeDetailsModal();
                    openModalForEdit(currentEventData);
                };
            }

            const deleteBtn = document.getElementById('deleteBtn');
            if (deleteBtn) {
                deleteBtn.onclick = async function() {
                    let senha = prompt('Digite a senha de administração para excluir este evento:');
                    if (!senha) return;

                    const response = await fetch(`/api/events/${currentEventData.id}`, {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ senha })
                    });

                    if (response.ok) {
                        alert('Evento excluído com sucesso!');
                        closeDetailsModal();
                        calendar.refetchEvents();
                    } else {
                        const errData = await response.json();
                        alert('Erro: ' + (errData.error || 'Senha incorreta'));
                    }
                };
            }
        });

        const eventFormEl = document.getElementById('eventForm');
        if (eventFormEl) {
            eventFormEl.addEventListener('submit', async function(e) {
                e.preventDefault();
                const id = document.getElementById('eventId').value;
                const data = {
                    title: document.getElementById('title').value,
                    coletivo: document.getElementById('coletivo').value,
                    date: document.getElementById('date').value,
                    time: document.getElementById('time').value,
                    endTime: document.getElementById('endTime').value,
                    location: document.getElementById('location').value,
                    description: document.getElementById('description').value,
                    link: document.getElementById('link').value
                };

                let url = '/api/events';
                let method = 'POST';

                if (id) {
                    let senha = prompt('Digite a senha de administração para salvar as alterações:');
                    if (!senha) return;
                    data.senha = senha;
                    url = `/api/events/${id}`;
                    method = 'PUT';
                }

                const response = await flexFetch(url, method, data); // fallback method helper abaixo
                if (response && response.ok) {
                    alert(id ? 'Evento atualizado com sucesso!' : 'Ato cadastrado com sucesso!');
                    closeModal();
                    if (calendar) calendar.refetchEvents();
                } else {
                    let errMessage = 'Não foi possível salvar.';
                    try {
                        const errData = await response.json();
                        errMessage = errData.error || errMessage;
                    } catch(ex) {}
                    alert('Erro: ' + errMessage);
                }
            });
        }

        async function flexFetch(url, method, data) {
            return await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }
    </script>
</body>
</html>
